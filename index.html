<style>
/* Layout: one long night. Each scene is a tall section with a sticky full-screen stage; scroll position drives the animation inside it. Layers per stage: scenery, darkness lit by your diya, glowing light sources, text. */
:root {
  --night: #07050b;
  --bone: #efe6d6;
  --smoke: #9a90a3;
  --blood: #b3121b;
  --blood-hi: #ff3b3b;
  --ember: #ff8a2a;
  --turmeric: #f2c230;
  --f-display: "Rozha One", "Rasa", Georgia, serif;
  --f-body: "Mukta", "Hind Vadodara", "Helvetica Neue", Arial, sans-serif;
  --lx: 50vw; --ly: 50vh; --lr: 220px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { background: var(--night); }
html.locked, html.locked body { overflow: hidden; }
body { margin: 0; background: var(--night); color: var(--bone); font-family: var(--f-body); font-size: 16px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--turmeric); outline-offset: 3px; }

/* ---------- fixed UI ---------- */
.ui { position: fixed; z-index: 60; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
.pill { display: flex; border: 1px solid rgba(239,230,214,.18); background: rgba(7,5,11,.65); backdrop-filter: blur(6px); border-radius: 999px; overflow: hidden; }
.pill button { background: none; border: 0; color: var(--smoke); padding: 5px 11px; font-size: 14px; font-weight: 600; }
.pill button[aria-pressed="true"] { color: #1a0d05; background: var(--turmeric); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; }
#flame { position: fixed; z-index: 30; width: 14px; height: 26px; margin: -30px 0 0 -7px; left: 0; top: 0; pointer-events: none; border-radius: 50% 50% 45% 45% / 62% 62% 38% 38%;
  background: radial-gradient(ellipse at 50% 78%, #fffbe0 0%, #ffd34d 32%, #ff7a1a 62%, rgba(255,80,0,0) 74%);
  filter: drop-shadow(0 0 10px rgba(255,140,40,.9)); animation: flick 1.3s infinite; opacity: 0; transition: opacity .4s; }
body.entered #flame.show { opacity: 1; }
@keyframes flick { 0%,100% { transform: scale(1,1) skewX(0); } 20% { transform: scale(.92,1.08) skewX(-4deg); } 40% { transform: scale(1.05,.94) skewX(3deg); } 60% { transform: scale(.95,1.1) skewX(-2deg); } 80% { transform: scale(1.02,.96) skewX(4deg); } }

/* ---------- gate ---------- */
#gate { position: fixed; inset: 0; z-index: 50; display: grid; place-items: end center; padding-bottom: calc(9svh + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(7,5,11,.96) 0%, rgba(7,5,11,.75) 45%, rgba(7,5,11,.15) 100%); transition: opacity 1.2s ease; }
#gate.gone { opacity: 0; pointer-events: none; }
.gate-card { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 560px; }
.kicker { font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--turmeric); font-weight: 600; }
.gate-card p { margin: 0; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn { border: 0; border-radius: 999px; padding: 12px 24px; font-weight: 600; font-size: 17px; background: linear-gradient(180deg, #ff9b3d, #e2531c); color: #1d0a02; box-shadow: 0 0 30px rgba(255,120,40,.45); transition: transform .2s, box-shadow .2s; text-decoration: none; display: inline-block; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 0 46px rgba(255,120,40,.7); }
.btn.ghost { background: transparent; color: var(--bone); box-shadow: inset 0 0 0 1px rgba(239,230,214,.3); }
.btn.wa { background: linear-gradient(180deg, #3ddc6f, #1fa84a); color: #04210e; box-shadow: 0 0 30px rgba(40,200,100,.35); }
.warn { font-size: 13px; color: var(--smoke); }

/* ---------- scenes ---------- */
.scene { position: relative; height: var(--len, 300vh); }
.stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
.layer { position: absolute; inset: 0; }
.layer > svg { width: 100%; height: 100%; display: block; }
.dark { z-index: 5; pointer-events: none; background: radial-gradient(circle var(--lr) at var(--lx) var(--ly), rgba(7,5,11,0) 0%, rgba(7,5,11,.05) 32%, rgba(7,5,11,var(--dk, .9)) 100%); }
body.calm .dark { background: rgba(7,5,11,.35); }
.glow { z-index: 6; pointer-events: none; }
.txt { position: absolute; z-index: 10; left: 0; right: 0; top: calc(10svh + env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); text-align: center; pointer-events: none; }
.line { position: absolute; left: 0; right: 0; margin: 0 auto; padding-inline: 16px; max-width: 22ch; font-family: var(--f-display); font-weight: 400; font-size: clamp(27px, 4.8vw, 56px); line-height: 1.2; text-wrap: balance;
  opacity: 0; transform: translateY(18px); filter: blur(8px); transition: opacity .8s ease, transform .8s ease, filter .8s ease;
  text-shadow: 0 2px 24px rgba(0,0,0,.95), 0 0 2px #000; }
html[lang="gu"] .line { font-family: "Rasa", var(--f-display); font-weight: 700; }
.line.on { opacity: 1; transform: none; filter: none; }
.line.red { color: var(--blood-hi); text-shadow: 0 0 28px rgba(179,18,27,.9), 0 2px 10px #000; }
#s-cross .txt { top: calc(20svh + env(safe-area-inset-top, 0px)); }
.hint { position: absolute; z-index: 10; left: 0; right: 0; bottom: calc(8svh + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 15px; color: var(--turmeric); letter-spacing: .08em; opacity: 0; transition: opacity .6s; pointer-events: none; }
.hint.on { opacity: .9; }

/* hero */
.moon { position: absolute; z-index: 6; width: min(34vmin, 300px); aspect-ratio: 1; border-radius: 50%; left: 50%; top: 13%; transform: translate(-50%, var(--moonY, 0px));
  background: radial-gradient(circle at 36% 33%, #ffb08a 0%, #f0603a 24%, #b9141c 60%, #520609 100%);
  box-shadow: 0 0 70px 14px rgba(240,96,58,.5), 0 0 220px 80px rgba(185,20,28,.3); animation: breathe 7s ease-in-out infinite; }
.moon::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 62% 58%, rgba(60,0,5,.35) 0 9%, transparent 10%), radial-gradient(circle at 30% 64%, rgba(60,0,5,.28) 0 6%, transparent 7%), radial-gradient(circle at 55% 26%, rgba(60,0,5,.22) 0 5%, transparent 6%); }
@keyframes breathe { 50% { box-shadow: 0 0 90px 20px rgba(240,96,58,.62), 0 0 260px 100px rgba(185,20,28,.38); } }
.title { position: absolute; z-index: 10; left: 0; right: 0; top: 47%; text-align: center; padding-inline: 16px; pointer-events: none; transform: translateY(var(--titleY, 0px)); }
.title h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(54px, 11vw, 140px); line-height: 1.05; color: var(--bone); }
.title h1 .g { display: inline-block; opacity: 0; filter: blur(10px); color: var(--ember); transition: opacity 1s ease, filter 1s ease, color 1.6s ease, text-shadow 1.6s ease; }
.title h1 .g.lit { opacity: 1; filter: none; color: var(--bone); text-shadow: 0 0 18px rgba(255,90,40,.75), 0 0 60px rgba(179,18,27,.6); }
.title .scripts { font-family: "Rasa", var(--f-display); font-size: clamp(20px, 3vw, 30px); color: var(--turmeric); letter-spacing: .06em; margin-top: 6px; opacity: 0; transition: opacity 1.4s ease 1.6s; }
.title .sub { font-size: clamp(16px, 2.2vw, 22px); color: var(--smoke); margin-top: 10px; opacity: 0; transition: opacity 1.4s ease 2.4s; }
body.entered .title .scripts, body.entered .title .sub { opacity: 1; }
.cue { position: absolute; z-index: 10; left: 50%; bottom: calc(15svh + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--smoke); display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: 0; transition: opacity 1s 3s; }
body.entered .cue { opacity: var(--cueO, 1); }
.cue i { width: 1px; height: 34px; background: linear-gradient(var(--smoke), transparent); animation: drip 1.8s ease-in infinite; }
@keyframes drip { from { transform: scaleY(0); transform-origin: top; } 60% { transform: scaleY(1); transform-origin: top; } to { transform: scaleY(1); opacity: 0; } }
.diyas { position: absolute; z-index: 6; left: 0; right: 0; bottom: calc(3svh + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; gap: clamp(14px, 4.5vw, 54px); }
.diya { position: relative; width: clamp(34px, 5.5vw, 62px); aspect-ratio: 2 / 1; }
.diya svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.diya .f { position: absolute; left: 50%; bottom: 62%; width: 26%; height: 120%; margin-left: -13%; border-radius: 50% 50% 45% 45% / 62% 62% 38% 38%; background: radial-gradient(ellipse at 50% 80%, #fffbe0 0%, #ffd34d 30%, #ff7a1a 60%, rgba(255,80,0,0) 74%); animation: flick 1.4s infinite; transform-origin: 50% 100%; }
.diya::after { content: ""; position: absolute; left: 50%; bottom: 55%; width: 220%; aspect-ratio: 1; transform: translateX(-50%); background: radial-gradient(circle, rgba(255,150,50,.28), rgba(255,100,20,0) 60%); border-radius: 50%; pointer-events: none; }
.diya:nth-child(2) .f { animation-delay: -.3s; } .diya:nth-child(3) .f { animation-delay: -.7s; } .diya:nth-child(4) .f { animation-delay: -.2s; } .diya:nth-child(5) .f { animation-delay: -1s; } .diya:nth-child(6) .f { animation-delay: -.5s; } .diya:nth-child(7) .f { animation-delay: -.9s; }
@media (max-width: 560px) { .diya:nth-child(n+6) { display: none; } }

/* swaying things */
.hang { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 3.2s ease-in-out infinite; }
.hang:nth-child(2n) { animation-duration: 2.7s; animation-delay: -.8s; } .hang:nth-child(3n) { animation-duration: 3.6s; animation-delay: -1.6s; }
@keyframes sway { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
.blinker { animation: blinkEyes 5s infinite; transform-box: fill-box; transform-origin: center; }
.blinker:nth-child(2) { animation-delay: -1.7s; animation-duration: 6.3s; } .blinker:nth-child(3) { animation-delay: -3.1s; animation-duration: 4.4s; }
@keyframes blinkEyes { 0%, 88%, 100% { transform: scaleY(1); } 92% { transform: scaleY(.05); } }
#hanger { transition: transform 1.1s cubic-bezier(.3,1.6,.5,1); transform: translateY(-560px); }
#hanger.down { transform: translateY(0); }
#hanger.down #hangSwing { animation: pend 4s ease-in-out 1.1s infinite; transform-box: view-box; transform-origin: 614px -14px; }
@keyframes pend { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
.tree-hit { pointer-events: auto; cursor: pointer; }
.redpulse { position: absolute; inset: 0; z-index: 7; pointer-events: none; opacity: var(--red, 0); background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 40%, rgba(150,0,10,.75) 100%); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { filter: brightness(1.5); } }
.shake { animation: shakeit .08s steps(2) infinite; }
@keyframes shakeit { 0% { transform: translate(-6px, 4px); } 100% { transform: translate(5px, -5px); } }

/* scare */
#s-scare .stage { background: #000; display: grid; place-items: center; }
#glitch { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; }
#glitch.on { opacity: 1; }
#glitch span { font-family: var(--f-display); font-size: clamp(34px, 7vw, 90px); color: var(--bone); text-align: center; padding: 0 16px; position: relative; text-shadow: 3px 0 rgba(255,0,60,.8), -3px 0 rgba(0,200,255,.7); animation: jit .1s steps(2) infinite; }
@keyframes jit { 0% { transform: translate(-3px, 1px) skewX(-6deg); } 100% { transform: translate(4px, -2px) skewX(5deg); } }
#face { position: absolute; inset: 0; opacity: 0; }
#face canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
#face.on { opacity: 1; }
#face.slow { transition: opacity 5s ease-in; opacity: 1; }
#face.shaking canvas { animation: shakeit .07s steps(2) infinite; transform: scale(1.12); }
.after { position: relative; z-index: 3; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; padding: 0 max(16px, env(safe-area-inset-left, 0px)); max-width: 640px; opacity: 0; transition: opacity 1.2s; }
.after.on { opacity: 1; }
.after h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(44px, 8vw, 96px); line-height: 1.05; color: var(--bone); text-shadow: 0 0 40px rgba(179,18,27,.8); }
.after p { margin: 0; font-size: 18px; color: var(--smoke); max-width: 40ch; }
@media (prefers-reduced-motion: reduce) { #face.shaking canvas, .shake, #glitch span { animation: none; } }

/* stories */
#stories { position: relative; padding-block: 90px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at 50% 0%, rgba(255,120,40,.12), transparent 60%), var(--night); }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.wrap h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 6vw, 60px); line-height: 1.1; text-wrap: balance; }
.wrap > p { margin: 0; color: var(--smoke); max-width: 60ch; }
.form { display: flex; flex-direction: column; gap: 14px; background: rgba(255,255,255,.035); border: 1px solid rgba(239,230,214,.12); border-radius: 14px; padding: 20px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label, fieldset legend { font-size: 14px; color: var(--smoke); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 540px) { .two { grid-template-columns: minmax(0, 1fr); } }
input[type="text"], textarea { background: rgba(0,0,0,.45); color: var(--bone); border: 1px solid rgba(239,230,214,.16); border-radius: 8px; padding: 10px 12px; width: 100%; box-sizing: border-box; }
textarea { min-height: 160px; resize: vertical; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { border: 1px solid rgba(239,230,214,.2); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 15px; position: relative; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips label:has(input:checked) { border-color: var(--turmeric); color: var(--turmeric); background: rgba(242,194,48,.08); }
.chips label:has(input:focus-visible) { outline: 2px solid var(--turmeric); outline-offset: 2px; }
.consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--smoke); }
.consent input { margin-top: 5px; accent-color: var(--ember); width: 18px; height: 18px; flex: none; }
.msg { margin: 0; min-height: 1.4em; font-size: 15px; }
.msg.ok { color: #7fe0a0; } .msg.err { color: var(--turmeric); }
.wall { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.story { border-left: 3px solid var(--ember); padding: 4px 0 4px 16px; }
.story .meta { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--turmeric); }
.story p { margin: 4px 0 0; white-space: pre-line; }
.empty { color: var(--smoke); border: 1px dashed rgba(239,230,214,.2); border-radius: 10px; padding: 16px; }
.subhead { font-family: var(--f-display); font-size: 26px; margin: 18px 0 0; }
footer { text-align: center; color: var(--smoke); font-size: 13px; padding: 30px 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--turmeric); text-decoration: underline; font-size: inherit; }
#credits { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.94); overflow-y: auto; display: grid; place-items: center; padding: 24px 16px; }
#credits .box { max-width: 560px; display: flex; flex-direction: column; gap: 12px; }
#credits a { color: var(--turmeric); overflow-wrap: anywhere; }

/* ---------- round 2: effects ---------- */
.dark { background: radial-gradient(circle var(--lr) at var(--lx) var(--ly), rgba(7,5,11,0) 0%, rgba(7,5,11,.05) 32%, rgba(7,5,11,calc(var(--dk, .9) * (1 - var(--flash, 0)))) 100%); }
#grain { position: fixed; inset: -50%; z-index: 25; pointer-events: none; opacity: .08; mix-blend-mode: overlay; animation: grain .5s steps(4) infinite; }
@keyframes grain { 0% { transform: translate(0, 0); } 25% { transform: translate(-3%, 2%); } 50% { transform: translate(2%, -3%); } 75% { transform: translate(-2%, -1%); } 100% { transform: translate(1%, 3%); } }
#bolt { position: fixed; inset: 0; z-index: 15; pointer-events: none; background: rgba(190,200,255,.0); }
.gate-name { display: flex; flex-direction: column; gap: 6px; width: min(380px, 100%); text-align: left; }
.gate-name label { font-size: 13px; color: var(--smoke); }
.gate-name input { background: rgba(0,0,0,.5); color: var(--bone); border: 1px solid rgba(239,230,214,.22); border-radius: 999px; padding: 10px 16px; text-align: center; font-size: 17px; }
.calls { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
.call { position: absolute; font-family: var(--f-display); color: var(--bone); opacity: 0; filter: blur(14px); transition: opacity 1.2s ease, filter 1.2s ease, transform 2.4s ease; text-shadow: 0 0 22px rgba(200,210,255,.5); white-space: nowrap; }
.call.on { opacity: .9; filter: blur(.4px); }
.call.c1 { left: 7%; top: 64%; font-size: clamp(22px, 3.4vw, 38px); transform: translateX(-20px); }
.call.c2 { right: 7%; top: 30%; font-size: clamp(28px, 4.6vw, 52px); transform: translateX(20px); }
.call.c3 { left: 0; right: 0; text-align: center; top: 46%; font-size: clamp(46px, 10vw, 120px); color: var(--blood-hi); letter-spacing: .08em; text-shadow: 0 0 40px rgba(179,18,27,.9); }
.call.on.c1, .call.on.c2 { transform: none; }
.turnL { animation: turnL .9s ease; } .turnR { animation: turnR .9s ease; }
@keyframes turnL { 30% { transform: translateX(-4%) rotate(-1deg); } } @keyframes turnR { 30% { transform: translateX(4%) rotate(1deg); } }
#cracks path { stroke-dasharray: 400; stroke-dashoffset: 400; transition: stroke-dashoffset .5s ease-out; }
#cracks.on path { stroke-dashoffset: 0; }
#rules { padding-block: 90px 30px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: linear-gradient(#000, var(--night)); }
.rules { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .rules { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .rules { grid-template-columns: minmax(0, 1fr); } }
.rule { border: 1px solid rgba(239,230,214,.12); border-radius: 14px; padding: 16px; background: rgba(255,255,255,.03); display: flex; flex-direction: column; gap: 10px; transition: opacity .9s ease, transform .9s ease, border-color .4s; }
.rule.pre { opacity: 0; transform: translateY(26px); }
.rule:hover { border-color: rgba(255,138,42,.5); }
.rule svg { width: 56px; height: 56px; }
.rule p { margin: 0; font-size: 16px; }
.rule .n { font-family: var(--f-display); color: var(--ember); font-size: 22px; line-height: 1; }
@media (prefers-reduced-motion: reduce) { #grain { animation: none; } .turnL, .turnR { animation: none; } }

/* ---------- round 3: AI art ---------- */
.photo { position: absolute; left: 50%; top: 50%; width: max(100%, calc(100svh * var(--ar))); aspect-ratio: var(--ar); transform: translate(-50%, -50%); }
.photo > img.base { width: 100%; height: 100%; display: block; }
.bulbglow { position: absolute; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(255,214,140,.45), rgba(255,170,60,0) 60%); mix-blend-mode: screen; }
.doorface { position: absolute; width: 3.4%; transform: translate(-50%, -50%); opacity: 0; -webkit-mask-image: radial-gradient(circle, #000 42%, transparent 70%); mask-image: radial-gradient(circle, #000 42%, transparent 70%); filter: brightness(.85) contrast(1.1); }
#sub { position: fixed; inset: 0; z-index: 40; pointer-events: none; opacity: 0; background: #000 url(assets/art/flash.webp) center / cover no-repeat; }
#sub.on { opacity: .9; }
#face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; display: block; }
#face.shaking img { animation: shakeit .07s steps(2) infinite; transform: scale(1.12); }
@media (prefers-reduced-motion: reduce) { #face.shaking img { animation: none; } }
.ghostimg { position: absolute; transform: translate(-50%, -100%); width: auto; mix-blend-mode: lighten; filter: url(#waver); -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); }

    for (const side of [-1, 1]) { g.beginPath(); g.moveTo(0, -s * .05); g.quadraticCurveTo(side * s * .5, tip - s * .1, side * s, tip); g.quadraticCurveTo(side * s * .78, tip + s * .22, side * s * .62, tip + s * .14); g.quadraticCurveTo(side * s * .48, tip + s * .3, side * s * .3, s * .16); g.quadraticCurveTo(side * s * .15, s * .2, 0, s * .1); g.fill(); }
    g.restore();
  }
  function drawLeaf(l) { g.save(); g.translate(l.x, l.y); g.rotate(l.a); const s = l.s; g.fillStyle = l.c; g.beginPath(); g.moveTo(0, s * .45); g.bezierCurveTo(s * .55, s * .2, s * .45, -s * .35, 0, -s * .75); g.bezierCurveTo(-s * .45, -s * .35, -s * .55, s * .2, 0, s * .45); g.fill(); g.restore(); }
  function particles(now, dt) {
    g.clearRect(0, 0, W, H);
    fog.forEach((f) => { if (!reduced) f.x += f.v * dt * .00003; if (f.x > 1.5) f.x = -.5; if (f.x < -.5) f.x = 1.5; const cx = f.x * W, cy = f.y * H, r = f.r * Math.max(W, H); const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r); gr.addColorStop(0, 'rgba(150,135,165,.03)'); gr.addColorStop(1, 'rgba(150,135,165,0)'); g.fillStyle = gr; g.fillRect(cx - r, cy - r, r * 2, r * 2); });
    if (!entered || reduced) return;
    if ((active === 'hero' || active === 'cross') && now > nextFlock) { flock(); nextFlock = now + 7000 + Math.random() * 7000; }
    bats = bats.filter((b) => b.x > -120 && b.x < W + 120); bats.forEach((b) => { b.x += b.v * dt * .06; b.ph += dt * .025; b.y += Math.sin(now / 300 + b.wob) * .4; drawBat(b); });
    if (active === 'cross' && S.cross.p > .1 && S.cross.p < .95 && Math.random() < .5) { const r = ladyWrap.getBoundingClientRect(); if (r.width) mist.push({ x: r.left + Math.random() * r.width, y: r.bottom - Math.random() * r.height * .3, r: r.width * (.3 + Math.random() * .5), life: 1, vx: (Math.random() - .5) * .4 }); }
    mist = mist.filter((m) => m.life > 0); mist.forEach((m) => { m.y -= .35; m.x += m.vx; m.life -= .008; const gr = g.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r); gr.addColorStop(0, `rgba(225,220,235,${(m.life * .035).toFixed(3)})`); gr.addColorStop(1, 'rgba(225,220,235,0)'); g.fillStyle = gr; g.fillRect(m.x - m.r, m.y - m.r, m.r * 2, m.r * 2); });
    if (active === 'tree' && Math.random() < .08) leaves.push({ x: Math.random() * W, y: -20, s: 12 + Math.random() * 14, a: Math.random() * 6, va: (Math.random() - .5) * .04, vy: .6 + Math.random() * .8, ph: Math.random() * 6, c: Math.random() < .7 ? '#1f3a1c' : '#5d6b26' });
    if (active === 'feet' || active === 'scare') leaves.forEach((l) => { l.vy = Math.max(l.vy, 5); });
    leaves = leaves.filter((l) => l.y < H + 40); leaves.forEach((l) => { l.y += l.vy * dt * .06; l.x += Math.sin(now / 600 + l.ph) * .9; l.a += l.va * dt * .06; drawLeaf(l); });
    if (active === 'hero' && Math.random() < .25) { const dl = document.querySelectorAll('.diya .f'); const d = dl[Math.random() * dl.length | 0]; if (d) { const r = d.getBoundingClientRect(); if (r.width) embers.push({ x: r.left + r.width / 2, y: r.top, vx: (Math.random() - .5) * .6, vy: -(.6 + Math.random()), life: 1 }); } }
    embers = embers.filter((e) => e.life > 0); embers.forEach((e) => { e.x += e.vx; e.y += e.vy; e.life -= .012; g.fillStyle = `rgba(255,${140 + (e.life * 80 | 0)},40,${e.life})`; g.beginPath(); g.arc(e.x, e.y, 1.6, 0, 7); g.fill(); });
  }

  /* ================= landing effects ================= */
  (() => { const d = $('#drips'); for (let i = 0; i < 11; i++) { const s = document.createElement('i'); s.className = 'drip'; s.style.left = (6 + Math.random() * 88).toFixed(1) + '%'; s.style.setProperty('--h', (14 + Math.random() * 42 | 0) + 'px'); s.style.setProperty('--d', (3 + Math.random() * 5).toFixed(1) + 's'); s.style.setProperty('--w', (1.2 + Math.random() * 3).toFixed(1) + 's'); s.style.width = (4 + Math.random() * 6 | 0) + 'px'; d.appendChild(s); } })();
  let nextEyes = 0;
  function spawnEyes(field, now) {
    if (now < nextEyes || !field || safe) return; nextEyes = now + 900 + Math.random() * 1600;
    if (field.children.length > 5) return;
    const e = document.createElement('div'); e.className = 'eyepair'; const s = 6 + Math.random() * 10;
    e.style.setProperty('--s', s.toFixed(1) + 'px'); e.style.setProperty('--g', (s * 1.6).toFixed(1) + 'px');
    e.style.left = (5 + Math.random() * 85).toFixed(1) + '%'; e.style.top = (8 + Math.random() * 75).toFixed(1) + '%';
    e.innerHTML = '<i></i><i></i>'; field.appendChild(e); setTimeout(() => e.remove(), 4600);
    if (Math.random() < .3) A.whisper(Math.random() * 2 - 1, .5);
  }
  const ghostSteps = [[64, 84, 42], [44, 92, 62], [70, 98, 80], [50, 112, 120]];
  let ghostStep = -1;
  function heroBolt() { ghostStep = Math.min(ghostSteps.length - 1, ghostStep + 1); const [x, y, h] = ghostSteps[ghostStep]; const g = $('#heroGhost'); g.style.left = x + '%'; g.style.top = y + '%'; g.style.height = h + '%'; }
  const face = $('#emergeFace');
  function updFace(p, now) {
    setLines(S.face, p);
    const q = Math.min(1, Math.max(0, (p - .05) / .7));
    face.style.opacity = (q * .9).toFixed(3);
    face.style.transform = `scale(${(.8 + .32 * q).toFixed(3)})`;
    face.style.filter = reduced ? 'none' : `url(#waver3) blur(${(18 * (1 - q)).toFixed(1)}px)`;
    if (p > .1) once('fa0', () => { A.breath(); A.dread(1); });
    if (p > .55) once('fa1', () => { A.whisper(0, 1.4); flash(90); });
    spawnEyes($('#eyesFace'), now);
    L.focus = () => ({ x: innerWidth / 2, y: innerHeight * .42 });
  }
  const HANDS = [[300, 260, -12, .9], [690, 200, 14, 1], [520, 410, 4, 1.15], [180, 430, -22, .8], [820, 420, 20, .85], [420, 150, -4, .75], [610, 330, 9, 1.25], [100, 170, -30, .7], [900, 150, 28, .75], [500, 280, 0, 1.6]];
  const handEls = HANDS.map(([x, y, r, s]) => { const u = document.createElementNS('http://www.w3.org/2000/svg', 'use'); u.setAttribute('href', '#hand'); u.setAttribute('transform', `translate(${x} ${y}) rotate(${r}) scale(${s})`); u.style.display = 'none'; $('#hands').appendChild(u); return u; });
  let handsShown = 0;
  function updHands(p) {
    setLines(S.hands, p);
    const n = Math.min(HANDS.length, Math.floor(Math.max(0, p - .06) / .62 * HANDS.length));
    handEls.forEach((u, i) => { const on = i < n; if (on && u.style.display === 'none') { u.style.display = ''; u.classList.remove('slap'); void u.getBBox; u.classList.add('slap'); } if (!on) u.style.display = 'none'; });
    if (n > handsShown) { A.thump(.5 + n * .04, 70 + Math.random() * 30); A.bells(Math.random() * 2 - 1, .02); if (!reduced) { const st = $('#handsStage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake'); setTimeout(() => st.classList.remove('shake'), 260); } }
    handsShown = n;
    const cr = p > .5; $('#glassCracks').setAttribute('opacity', cr ? .8 : 0); if (cr) once('hc', () => { A.crack(); flash(80); });
    if (p > .8) once('hstory', () => { A.dread(0); });
    L.focus = () => ({ x: innerWidth / 2, y: innerHeight / 2 });
  }

  /* ================= ambience, lightning, wavering ghosts ================= */
  let nextAmb = 9000, nextBolt = 3000, flashT = -1;
  function ambience(now) {
    if (now < nextAmb || active === 'scare') return; nextAmb = now + 11000 + Math.random() * 12000;
    const pick = { hero: ['howl', 'owl'], cross: ['howl', 'bells', 'whisper'], tree: ['owl', 'whisper'], name: ['whisper', 'bells'], mirror: ['bells', 'whisper'], feet: ['bells'] }[active] || [];
    const k = pick[Math.random() * pick.length | 0]; if (k === 'bells') A.bells(Math.random() * 2 - 1, .03); else if (k === 'whisper') A.whisper(Math.random() < .5 ? -1 : 1, .7); else if (k) A[k]();
  }
  function lightning(now) {
    if (safe || reduced || !(active === 'hero' || active === 'cross')) { root.setProperty('--flash', 0); $('#bolt').style.background = 'transparent'; $('#heroGhost').style.opacity = 0; return; }
    if (now > nextBolt) { flashT = now; nextBolt = now + (active === 'hero' ? 4500 + Math.random() * 3500 : 13000 + Math.random() * 10000); if (active === 'hero') heroBolt(); setTimeout(() => A.thunder(), 500 + Math.random() * 500); }
    const e = now - flashT; let f = 0;
    if (flashT > 0 && e < 520) f = e < 70 ? 1 : e < 160 ? 0 : e < 230 ? .7 : Math.max(0, 1 - (e - 230) / 290) * .25;
    root.setProperty('--flash', f.toFixed(2)); $('#bolt').style.background = `rgba(190,200,255,${(f * .22).toFixed(3)})`;
    $('#heroGhost').style.opacity = active === 'hero' && f > .05 ? 1 : 0;
  }
  const turbs = [$('#turb'), $('#turb2'), $('#turb3')];
  let wv = 0;
  function waver(now) {
    if (reduced || ++wv % 2) return;
    const s = Math.sin(now / 700), s2 = Math.cos(now / 430);
    turbs[0].setAttribute('baseFrequency', `${(.012 + .004 * s).toFixed(4)} ${(.06 + .02 * s2).toFixed(4)}`);
    turbs[1].setAttribute('baseFrequency', `${(.02 + .006 * s2).toFixed(4)} ${(.05 + .02 * s).toFixed(4)}`);
    turbs[2].setAttribute('baseFrequency', `${(.03 + .01 * s).toFixed(4)} ${(.08 + .03 * s2).toFixed(4)}`);
  }
  /* rules reveal */
  const rulesEls = [...document.querySelectorAll('.rule')];
  if ('IntersectionObserver' in window && !reduced) {
    rulesEls.forEach((r) => r.classList.add('pre'));
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { const i = rulesEls.indexOf(e.target); setTimeout(() => e.target.classList.remove('pre'), i % 3 * 160); io.unobserve(e.target); } }), { threshold: .3 });
    rulesEls.forEach((r) => io.observe(r));
  }
  /* film grain tile */
  (() => { const c = document.createElement('canvas'); c.width = c.height = 160; const x = c.getContext('2d'), d = x.createImageData(160, 160); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); $('#grain').style.backgroundImage = `url(${c.toDataURL()})`; })();

  /* ================= main loop ================= */
  let last = performance.now(), nextCricket = 0;
  const root = document.documentElement.style;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(64, now - last); last = now;
    let best = 'hero';
    for (const k of Object.keys(S)) { const r = prog(S[k]); S[k].p = r.p; S[k].top = r.top; if (r.active) best = k; }
    active = best;
    if (entered) {
      updHero(S.hero.p);
      if (active === 'cross') updCross(S.cross.p, now);
      if (active === 'face') updFace(S.face.p, now);
      if (active === 'hands') updHands(S.hands.p);
      if (active === 'hero') spawnEyes($('#eyesHero'), now);
      A.themeLevel(['hero', 'face', 'hands'].includes(active) ? .8 : active === 'scare' ? 0 : .14);
      if (active === 'tree') updTree(S.tree.p);
      if (active === 'name') updName(S.name.p);
      if (active === 'mirror') updMirror(S.mirror.p);
      if (active === 'feet') updFeet(S.feet.p, now); else L.scale = active === 'scare' ? 0 : 1;
      if (!['hero', 'face', 'hands', 'cross', 'tree', 'feet', 'name', 'mirror'].includes(active)) L.focus = null;
      ambience(now); lightning(now); waver(now);
      if (S.scare.top <= 2 && S.scare.top > -innerHeight) scare();
      if ((active === 'hero' || active === 'cross') && now > nextCricket) { A.cricket(); nextCricket = now + 500 + Math.random() * 1400; }
    }
    // the light: follow the pointer, or drift to what matters
    const idle = now - L.last > 2500;
    if (idle) { const f = L.focus && L.focus(); const wx = Math.sin(now / 2300) * W * .12, wy = Math.cos(now / 1900) * H * .06; L.tx = (f ? f.x : W / 2) + wx * (f ? .3 : 1); L.ty = (f ? f.y : H * .55) + wy * (f ? .3 : 1); if (coarse) flame.classList.remove('show'); }
    L.x += (L.tx - L.x) * (idle ? .03 : .2); L.y += (L.ty - L.y) * (idle ? .03 : .2);
    const base = Math.min(260, Math.max(150, Math.min(W, H) * .33));
    const flick = reduced ? 1 : .93 + .07 * Math.sin(now / 70) * Math.sin(now / 23);
    root.setProperty('--lx', L.x.toFixed(1) + 'px'); root.setProperty('--ly', L.y.toFixed(1) + 'px'); root.setProperty('--lr', (base * flick * L.scale + 1).toFixed(1) + 'px');
    flame.style.transform = `translate(${L.x}px, ${L.y}px)`;
    particles(now, dt);
  }
  requestAnimationFrame(frame);

  /* ================= stories ================= */
  let stories = [];
  fetch('/api/published').then((r) => (r.ok ? r : fetch('stories.json'))).catch(() => fetch('stories.json')).then((r) => (r && r.ok ? r.json() : [])).then((d) => { stories = Array.isArray(d) ? d : []; renderWall(); }).catch(() => {});
  function renderWall() {
    const wall = $('#wall'); if (!wall) return; wall.innerHTML = '';
    if (!stories.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = t('st_empty'); wall.appendChild(li); return; }
    stories.forEach((s) => { const li = document.createElement('li'); li.className = 'story'; const m = document.createElement('div'); m.className = 'meta'; m.textContent = [T[lang].kinds[s.kind], s.name || t('anon'), s.city].filter(Boolean).join(' · '); const p = document.createElement('p'); p.textContent = s.story; li.append(m, p); wall.appendChild(li); });
  }
  $('#storyForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const msg = $('#sMsg'); msg.className = 'msg';
    const story = $('#sStory').value.trim();
    if (story.length < 40) { msg.textContent = t('st_short'); msg.classList.add('err'); $('#sStory').focus(); return; }
    if (!$('#sConsent').checked) { msg.textContent = t('st_noconsent'); msg.classList.add('err'); return; }
    const body = { website: $('#sWeb').value, name: $('#sName').value.trim(), city: $('#sCity').value.trim(), kind: document.querySelector('input[name="kind"]:checked').value, story, lang };
    try {
      const r = await fetch('/api/stories', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if ([404, 405, 501].includes(r.status)) { msg.textContent = t('st_offline'); msg.classList.add('err'); return; }
      if (r.status === 429) { msg.textContent = t('st_rate'); msg.classList.add('err'); return; }
      if (r.status === 422) { msg.textContent = t('st_short'); msg.classList.add('err'); return; }
      if (!r.ok) throw new Error(String(r.status));
      msg.textContent = t('st_sent'); msg.classList.add('ok'); $('#sStory').value = ''; $('#sConsent').checked = false;
    } catch (err) { msg.textContent = t('st_fail'); msg.classList.add('err'); }
  });

  /* ================= credits ================= */
  fetch('assets/credits.json').then((r) => (r.ok ? r.json() : [])).then((list) => list.forEach((c) => {
    const li = document.createElement('li'); li.append(`${c.use}: “${c.title}” by ${c.creator || 'creator not listed'}, `);
    const a1 = document.createElement('a'); a1.href = c.source; a1.target = '_blank'; a1.rel = 'noopener'; a1.textContent = 'source';
    const a2 = document.createElement('a'); a2.href = c.license_url; a2.target = '_blank'; a2.rel = 'noopener'; a2.textContent = c.license;
    li.append(a1, ', ', a2, '.'); $('#creditList').appendChild(li);
  })).catch(() => {});
  $('#openCredits').addEventListener('click', () => { $('#credits').hidden = false; });
  $('#closeCredits').addEventListener('click', () => { $('#credits').hidden = true; });

  applyLang();
})();
</script>
